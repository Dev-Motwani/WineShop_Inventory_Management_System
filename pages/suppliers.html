<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suppliers | Wine & Beer Store</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Global CSS -->
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

  <!-- ===== HEADER ===== -->
  <header class="main-header dashboard-header">
    <div class="logo">
      <i class="fa-solid fa-wine-bottle"></i>
      <span>Wine & Beer Store</span>
    </div>
    <a href="dashboard.html">
      <button id="logoutBtn" class="btn btn-logout">
        <i class="fa-solid fa-right-from-bracket">
          <t>Dashboard</t>
      </button></i></a>
  </header>

  <!-- ===== MAIN WRAPPER ===== -->
  <div class="main-wrapper">

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar">
      <ul class="sidebar-menu">
        <li><a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
        <li><a href="inventory.html"><i class="fas fa-boxes"></i> Inventory</a></li>
        <li><a href="sales.html"><i class="fas fa-shopping-cart"></i> Sales</a></li>
        <li><a href="reports.html"><i class="fas fa-chart-line"></i> Reports</a></li>
        <li><a href="suppliers.html" class="active"><i class="fas fa-truck"></i> Suppliers</a></li>
        <li><a href="customers.html"><i class="fas fa-users"></i> Customers</a></li>
        <li><a href="settings.html"><i class="fas fa-cog"></i> Settings</a></li>
      </ul>
    </aside>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="content">
      <section class="inventory-section">
        <h2>Manage Suppliers</h2>

        <!-- Add Supplier Form -->
        <form id="supplierForm">
          <div class="form-group">
            <input type="text" id="supplierName" placeholder="Supplier Name" required>
          </div>
          <div class="form-group">
            <input type="text" id="supplierContact" placeholder="Contact Number" required>
          </div>
          <div class="form-group">
            <input type="text" id="supplierAddress" placeholder="Address" required>
          </div>
          <button type="submit" class="btn primary"><i class="fas fa-plus-circle"></i> Add Supplier</button>
        </form>

        <!-- Suppliers Table -->
        <h3>Suppliers List</h3>
        <table id="suppliersTable">
          <thead>
            <tr>
              <th>Name</th>
              <th>Contact</th>
              <th>Address</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <!-- Supplier data will be injected dynamically here -->
          </tbody>
        </table>

      </section>
    </main>
  </div>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    <p>© 2025 Wine & Beer Store Inventory System</p>
  </footer>

  <!-- ===== JS ===== -->
  <script src="../assets/js/suppliers.js"></script>
</body>

</html>
