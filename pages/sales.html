<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Management | Wine & Beer Store</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Global CSS -->
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

  <!-- ===== HEADER ===== -->
  <header class="main-header dashboard-header">
    <div class="logo">
      <i class="fa-solid fa-wine-bottle"></i>
      <span>Wine & Beer Store</span>
    </div>

    <!-- Hamburger Menu for Mobile -->
    <i class="fas fa-bars menu-toggle"></i>

    <a href="dashboard.html">
      <button id="logoutBtn" class="btn btn-logout">
        <i class="fa-solid fa-right-from-bracket">
          <t>Dashboard</t>
      </button></i></a>
  </header>

  <!-- ===== MAIN WRAPPER ===== -->
  <div class="main-wrapper">

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar">
      <ul class="sidebar-menu">
        <li><a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
        <li><a href="inventory.html"><i class="fas fa-boxes"></i> Inventory</a></li>
        <li><a href="sales.html" class="active"><i class="fas fa-shopping-cart"></i> Sales</a></li>
        <li><a href="reports.html"><i class="fas fa-chart-line"></i> Reports</a></li>
        <li><a href="suppliers.html"><i class="fas fa-truck"></i> Suppliers</a></li>
        <li><a href="customers.html"><i class="fas fa-users"></i> Customers</a></li>
        <li><a href="settings.html"><i class="fas fa-cog"></i> Settings</a></li>
      </ul>
    </aside>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="content">
      <section class="inventory-section">
        <h2>Record a Sale</h2>

        <!-- Sale Form -->
        <form id="salesForm">
          <div class="form-group">
            <select id="productSelect" required>
              <option value="">Select Product</option>
              <!-- Products will be loaded dynamically from inventory -->
            </select>
          </div>
          <div class="form-group">
            <input type="number" id="saleQuantity" placeholder="Quantity Sold" min="1" required>
          </div>
          <div class="form-group">
            <input type="text" id="customerName" placeholder="Customer Name (optional)">
          </div>
          <button type="submit" class="btn primary"><i class="fas fa-plus-circle"></i> Record Sale</button>
        </form>

        <!-- Sales Table -->
        <h3>Recent Sales</h3>
        <table id="salesTable">
          <thead>
            <tr>
              <th>Product</th>
              <th>Category</th>
              <th>Brand</th>
              <th>Quantity</th>
              <th>Customer</th>
              <th>Total Price (₹)</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody>
            <!-- Sales data will be dynamically injected here -->
          </tbody>
        </table>

      </section>
    </main>
  </div>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    <p>© 2025 Wine & Beer Store Inventory System</p>
  </footer>

  <!-- ===== GLOBAL LAYOUT JS ===== -->
  <script src="../assets/js/layout.js"></script>

  <!-- ===== SALES PAGE JS ===== -->
  <script src="../assets/js/sales.js"></script>

</body>

</html>
